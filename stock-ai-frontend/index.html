<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI驱动的股票交易系统" />
    <meta name="keywords" content="股票,交易,AI,人工智能,投资" />
    
    <!-- DNS预解析 -->
    <link rel="dns-prefetch" href="//localhost:5000" />
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net" />
    
    <!-- 预连接 -->
    <link rel="preconnect" href="//localhost:5000" crossorigin />
    
    <!-- 关键资源预加载（仅在需要时启用） -->
    <!-- 注意：Vite 开发模式下，这些预加载可能会产生警告，可以注释掉 -->
    <!-- <link rel="preload" href="/src/main.ts" as="script" crossorigin /> -->
    <!-- <link rel="preload" href="/src/styles/index.scss" as="style" /> -->
    
    <!-- 字体预加载（仅在需要时启用） -->
    <!-- <link rel="preload" href="//at.alicdn.com/t/font_2305433_bu8s0ulpz6.woff2" as="font" type="font/woff2" crossorigin /> -->
    
    <!-- 性能优化 -->
    <meta name="theme-color" content="#409eff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <title>Stock AI Frontend</title>
  </head>
  <body>
    <div id="app">
      <!-- 加载动画 -->
      <div id="loading" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      ">
        <div style="text-align: center;">
          <div style="
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #409eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
          "></div>
          <div style="color: #666; font-size: 14px;">加载中...</div>
        </div>
      </div>
    </div>
    
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
