tags:
  - 交易
summary: 下单
description: 创建新的交易订单
security:
  - Bearer: []
parameters:
  - name: order
    in: body
    required: true
    schema:
      type: object
      required:
        - symbol
        - side
        - quantity
        - order_type
      properties:
        symbol:
          type: string
          description: 股票代码
          example: "000001"
        side:
          type: string
          enum: ["buy", "sell"]
          description: 交易方向
          example: "buy"
        quantity:
          type: integer
          minimum: 100
          description: 交易数量（必须是100的倍数）
          example: 1000
        order_type:
          type: string
          enum: ["market", "limit"]
          description: 订单类型
          example: "limit"
        price:
          type: number
          format: float
          minimum: 0.01
          description: 价格（限价单必填）
          example: 10.50
        time_in_force:
          type: string
          enum: ["GTC", "IOC", "FOK"]
          default: "GTC"
          description: 订单有效期
          example: "GTC"
responses:
  201:
    description: 下单成功
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/definitions/Order'
  400:
    description: 请求参数错误
    schema:
      $ref: '#/definitions/ErrorResponse'
  401:
    description: 未授权
    schema:
      $ref: '#/definitions/ErrorResponse'
  403:
    description: 资金不足或风控限制
    schema:
      $ref: '#/definitions/ErrorResponse'

---
tags:
  - 交易
summary: 获取订单列表
description: 获取用户的订单列表
security:
  - Bearer: []
parameters:
  - name: status
    in: query
    type: string
    enum: ["pending", "filled", "cancelled", "rejected"]
    description: 订单状态过滤
    example: "pending"
  - name: symbol
    in: query
    type: string
    description: 股票代码过滤
    example: "000001"
  - name: side
    in: query
    type: string
    enum: ["buy", "sell"]
    description: 交易方向过滤
    example: "buy"
  - name: start_date
    in: query
    type: string
    format: date
    description: 开始日期
    example: "2024-01-01"
  - name: end_date
    in: query
    type: string
    format: date
    description: 结束日期
    example: "2024-03-31"
  - name: page
    in: query
    type: integer
    default: 1
    minimum: 1
    description: 页码
    example: 1
  - name: per_page
    in: query
    type: integer
    default: 20
    minimum: 1
    maximum: 100
    description: 每页数量
    example: 20
responses:
  200:
    description: 获取成功
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/definitions/Order'
        pagination:
          $ref: '#/definitions/PaginationInfo'
  401:
    description: 未授权
    schema:
      $ref: '#/definitions/ErrorResponse'

