---
tags:
  - 系统
summary: 获取系统日志
description: 获取系统日志（管理员权限）
security:
  - Bearer: []
parameters:
  - name: level
    in: query
    type: string
    enum: ["DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"]
    description: 日志级别过滤
    example: "ERROR"
  - name: start_time
    in: query
    type: string
    format: date-time
    description: 开始时间
    example: "2024-01-01T00:00:00Z"
  - name: end_time
    in: query
    type: string
    format: date-time
    description: 结束时间
    example: "2024-01-01T23:59:59Z"
  - name: limit
    in: query
    type: integer
    default: 100
    minimum: 1
    maximum: 1000
    description: 返回数量
    example: 100
responses:
  200:
    description: 获取成功
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
                description: 时间戳
              level:
                type: string
                description: 日志级别
              logger:
                type: string
                description: 记录器名称
              message:
                type: string
                description: 日志消息
              module:
                type: string
                description: 模块名称
              function:
                type: string
                description: 函数名称
              line:
                type: integer
                description: 行号
  401:
    description: 未授权
    schema:
      $ref: '#/definitions/ErrorResponse'
  403:
    description: 权限不足
    schema:
      $ref: '#/definitions/ErrorResponse'