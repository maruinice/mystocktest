  - 系统
summary: 清除缓存
description: 清除系统缓存（管理员权限）
security:
  - Bearer: []
parameters:
  - name: cache_type
    in: query
    type: string
    enum: ["all", "user", "market", "strategy"]
    default: "all"
    description: 缓存类型
    example: "all"
responses:
  200:
    description: 缓存清除成功
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
