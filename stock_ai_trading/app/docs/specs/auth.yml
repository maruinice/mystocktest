---
tags:
  - 认证
summary: 更新用户资料
description: 更新当前用户的信息
security:
  - Bearer: []
parameters:
  - name: user_data
    in: body
    required: true
    schema:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 100
          description: 全名
          example: "新的用户名"
        email:
          type: string
          format: email
          description: 邮箱地址
          example: "newemail@example.com"
responses:
  200:
    description: 更新成功
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "用户资料更新成功"
        data:
          $ref: '#/definitions/User'
  400:
    description: 请求参数错误
    schema:
      $ref: '#/definitions/ErrorResponse'
  401:
    description: 未授权
    schema:
      $ref: '#/definitions/ErrorResponse'

---
tags:
  - 认证
summary: 修改密码
description: 修改当前用户的密码
security:
  - Bearer: []
parameters:
  - name: password_data
    in: body
    required: true
    schema:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
          description: 当前密码
          example: "OldPassword123"
        new_password:
          type: string
          minLength: 8
          description: 新密码
          example: "NewPassword123"
responses:
  200:
    description: 修改成功
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "密码修改成功"
  400:
    description: 请求参数错误
    schema:
      $ref: '#/definitions/ErrorResponse'
  401:
    description: 当前密码错误
    schema:
      $ref: '#/definitions/ErrorResponse'