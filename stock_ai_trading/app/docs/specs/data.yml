    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/definitions/Stock'
  401:
    description: 未授权
    schema:
      $ref: '#/definitions/ErrorResponse'

---
tags:
  - 数据
summary: 搜索股票
description: 根据股票代码或名称搜索股票
security:
  - Bearer: []
parameters:
  - name: query
    in: query
    type: string
    required: true
    minLength: 1
    description: 搜索关键词
    example: "平安"
  - name: limit
    in: query
    type: integer
    default: 10
    minimum: 1
    maximum: 50
    description: 返回数量
    example: 10
responses:
  200:
    description: 搜索成功
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            properties:
              symbol:
                type: string
                description: 股票代码
              name:
                type: string
                description: 股票名称
              industry:
                type: string
                description: 所属行业
              market:
                type: string
                description: 所属市场
  400:
    description: 请求参数错误
    schema:
      $ref: '#/definitions/ErrorResponse'
  401:
    description: 未授权
    schema:
      $ref: '#/definitions/ErrorResponse'

---
tags:
  - 数据
summary: 获取财务数据
description: 获取股票的财务报表数据
security:
  - Bearer: []
parameters:
  - name: symbol
    in: path
    type: string
    required: true
    description: 股票代码
    example: "000001"
  - name: report_type
    in: query
    type: string
    enum: ["income", "balance", "cashflow"]
    default: "income"
    description: 报表类型
    example: "income"
  - name: period
    in: query
    type: string
    enum: ["annual", "quarterly"]
    default: "annual"
    description: 报告期间
    example: "annual"
responses:
  200:
    description: 获取成功
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            properties:
              period:
                type: string
                description: 报告期
              revenue:
                type: number
                format: float
                description: 营业收入
              net_income:
                type: number
                format: float
                description: 净利润
              eps:
                type: number
                format: float
                description: 每股收益
  400:
    description: 请求参数错误
    schema:
      $ref: '#/definitions/ErrorResponse'
  401:
    description: 未授权
    schema:
      $ref: '#/definitions/ErrorResponse'