---
tags:
  - 策略
summary: 获取策略表现
description: 获取策略的历史表现数据
security:
  - Bearer: []
parameters:
  - name: strategy_id
    in: path
    type: string
    required: true
    description: 策略ID
    example: "ma_crossover"
  - name: period
    in: query
    type: string
    enum: ["1d", "1w", "1M", "3M", "6M", "1Y"]
    default: "1M"
    description: 统计周期
    example: "1M"
responses:
  200:
    description: 获取成功
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            strategy_id:
              type: string
              description: 策略ID
            strategy_name:
              type: string
              description: 策略名称
            period:
              type: string
              description: 统计周期
            total_return:
              type: number
              format: float
              description: 总收益率
            annualized_return:
              type: number
              format: float
              description: 年化收益率
            volatility:
              type: number
              format: float
              description: 波动率
            sharpe_ratio:
              type: number
              format: float
              description: 夏普比率
            max_drawdown:
              type: number
              format: float
              description: 最大回撤
            win_rate:
              type: number
              format: float
              description: 胜率
            profit_factor:
              type: number
              format: float
              description: 盈利因子
            total_trades:
              type: integer
              description: 总交易次数
            performance_chart:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  value:
                    type: number
                    format: float
              description: 表现图表数据
  401:
    description: 未授权
    schema:
      $ref: '#/definitions/ErrorResponse'
  404:
    description: 策略不存在
    schema:
      $ref: '#/definitions/ErrorResponse'

