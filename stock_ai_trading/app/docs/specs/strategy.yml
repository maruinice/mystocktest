tags:
  - 策略
summary: 运行回测
description: 运行策略回测
security:
  - Bearer: []
parameters:
  - name: backtest
    in: body
    required: true
    schema:
      type: object
      required:
        - strategy_id
        - start_date
        - end_date
        - initial_capital
      properties:
        strategy_id:
          type: string
          description: 策略ID
          example: "ma_crossover"
        start_date:
          type: string
          format: date
          description: 回测开始日期
          example: "2024-01-01"
        end_date:
          type: string
          format: date
          description: 回测结束日期
          example: "2024-03-31"
        initial_capital:
          type: number
          format: float
          minimum: 10000
          description: 初始资金
          example: 100000.0
        symbols:
          type: array
          items:
            type: string
          description: 股票代码列表
          example: ["000001", "000002", "600000"]
        parameters:
          type: object
          description: 策略参数
          example:
            short_window: 5
            long_window: 20
responses:
  201:
    description: 回测启动成功
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            backtest_id:
              type: string
              description: 回测ID
            status:
              type: string
              enum: ["running", "completed", "failed"]
              description: 回测状态
            created_at:
              type: string
              format: date-time
              description: 创建时间
  400:
    description: 请求参数错误
    schema:
      $ref: '#/definitions/ErrorResponse'
  401:
    description: 未授权
    schema:
      $ref: '#/definitions/ErrorResponse'

---
tags:
  - 策略
summary: 获取回测结果
description: 获取指定回测的结果
security:
  - Bearer: []
parameters:
  - name: backtest_id
    in: path
    type: string
    required: true
    description: 回测ID
    example: "bt_123456789"
responses:
  200:
    description: 获取成功
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/definitions/BacktestResult'
  401:
    description: 未授权
    schema:
      $ref: '#/definitions/ErrorResponse'
  404:
    description: 回测结果不存在
    schema:
      $ref: '#/definitions/ErrorResponse'

---
tags:
  - 策略
summary: 获取回测历史
description: 获取用户的回测历史记录
security:
  - Bearer: []
parameters:
  - name: strategy_id
    in: query
    type: string
    description: 策略ID过滤
    example: "ma_crossover"
  - name: status
    in: query
    type: string
    enum: ["running", "completed", "failed"]
    description: 状态过滤
    example: "completed"
  - name: start_date
    in: query
    type: string
    format: date
    description: 开始日期
    example: "2024-01-01"
  - name: end_date
    in: query
    type: string
    format: date
    description: 结束日期
    example: "2024-03-31"
  - name: page
    in: query
    type: integer
    default: 1
    minimum: 1
    description: 页码
    example: 1
  - name: per_page
    in: query
    type: integer
    default: 20
    minimum: 1
    maximum: 100
    description: 每页数量
    example: 20
responses:
  200:
    description: 获取成功
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            properties:
              backtest_id:
                type: string
                description: 回测ID
              strategy_id:
                type: string
                description: 策略ID
              strategy_name:
                type: string
                description: 策略名称
              start_date:
                type: string
                format: date
                description: 回测开始日期
              end_date:
                type: string
                format: date
                description: 回测结束日期
              initial_capital:
                type: number
                format: float
                description: 初始资金
              final_value:
                type: number
                format: float
                description: 最终价值
              total_return:
                type: number
                format: float
                description: 总收益率
              status:
                type: string
                enum: ["running", "completed", "failed"]
                description: 状态
              created_at:
                type: string
                format: date-time
                description: 创建时间
        pagination:
          $ref: '#/definitions/PaginationInfo'
  401:
    description: 未授权
    schema:
      $ref: '#/definitions/ErrorResponse'

---
tags:
  - 策略
summary: 获取交易信号
description: 获取策略的交易信号
security:
  - Bearer: []
parameters:
  - name: strategy_id
    in: query
    type: string
    required: true
    description: 策略ID
    example: "ma_crossover"
  - name: symbols
    in: query
    type: string
    description: 股票代码列表，用逗号分隔
    example: "000001,000002,600000"
  - name: limit
    in: query
    type: integer
    default: 20
    minimum: 1
    maximum: 100
    description: 返回数量
    example: 20
responses:
  200:
    description: 获取成功
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            properties:
              symbol:
                type: string
                description: 股票代码
              name:
                type: string
                description: 股票名称
              signal:
                type: string
                enum: ["buy", "sell", "hold"]
                description: 交易信号
              strength:
                type: number
                format: float
                minimum: 0
                maximum: 1
                description: 信号强度
              price:
                type: number
                format: float
                description: 当前价格
              target_price:
                type: number
                format: float
                description: 目标价格
              stop_loss:
                type: number
                format: float
                description: 止损价格
              confidence:
                type: number
                format: float
                minimum: 0
                maximum: 1
                description: 信号置信度
              timestamp:
                type: string
                format: date-time
                description: 信号生成时间
  400:
    description: 请求参数错误
    schema:
      $ref: '#/definitions/ErrorResponse'
  401:
    description: 未授权
    schema:
      $ref: '#/definitions/ErrorResponse'

