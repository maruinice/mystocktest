---
tags:
  - 策略
summary: 选择策略
description: 选择并激活交易策略
security:
  - Bearer: []
parameters:
  - name: strategy
    in: body
    required: true
    schema:
      type: object
      required:
        - strategy_id
      properties:
        strategy_id:
          type: string
          description: 策略ID
          example: "ma_crossover"
        parameters:
          type: object
          description: 策略参数
          example:
            short_window: 5
            long_window: 20
        symbols:
          type: array
          items:
            type: string
          description: 应用的股票代码列表
          example: ["000001", "000002", "600000"]
        auto_trade:
          type: boolean
          default: false
          description: 是否启用自动交易
          example: false
responses:
  200:
    description: 策略选择成功
    schema:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "策略选择成功"
        data:
          type: object
          properties:
            strategy_id:
              type: string
              description: 策略ID
            strategy_name:
              type: string
              description: 策略名称
            status:
              type: string
              enum: ["active", "inactive"]
              description: 策略状态
            activated_at:
              type: string
              format: date-time
              description: 激活时间
  400:
    description: 请求参数错误
    schema:
      $ref: '#/definitions/ErrorResponse'
  401:
    description: 未授权
    schema:
      $ref: '#/definitions/ErrorResponse'
  404:
    description: 策略不存在
    schema:
      $ref: '#/definitions/ErrorResponse'

