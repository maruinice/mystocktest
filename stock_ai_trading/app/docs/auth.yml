login:
  tags:
    - 认证
  summary: 用户登录
  description: 用户通过用户名和密码进行登录认证
  parameters:
    - name: body
      in: body
      required: true
      schema:
        type: object
        required:
          - username
          - password
        properties:
          username:
            type: string
            description: 用户名或邮箱
            example: "admin"
          password:
            type: string
            description: 密码
            example: "password123"
  responses:
    200:
      description: 登录成功
      schema:
        type: object
        properties:
          message:
            type: string
            example: "登录成功"
          data:
            type: object
            properties:
              user:
                $ref: '#/definitions/User'
              tokens:
                type: object
                properties:
                  access_token:
                    type: string
                    description: 访问令牌
                  refresh_token:
                    type: string
                    description: 刷新令牌
                  token_type:
                    type: string
                    example: "bearer"
                  expires_in:
                    type: integer
                    description: 过期时间（秒）
          code:
            type: integer
            example: 200
    400:
      description: 请求参数错误
      schema:
        $ref: '#/definitions/ErrorResponse'
    401:
      description: 认证失败
      schema:
        $ref: '#/definitions/ErrorResponse'
    429:
      description: 请求过于频繁
      schema:
        $ref: '#/definitions/ErrorResponse'
    500:
      description: 服务器内部错误
      schema:
        $ref: '#/definitions/ErrorResponse'

register:
  tags:
    - 认证
  summary: 用户注册
  description: 创建新用户账户
  parameters:
    - name: body
      in: body
      required: true
      schema:
        type: object
        required:
          - username
          - email
          - password
        properties:
          username:
            type: string
            description: 用户名（3-20位字母、数字、下划线）
            example: "newuser"
          email:
            type: string
            format: email
            description: 邮箱地址
            example: "user@example.com"
          password:
            type: string
            description: 密码（至少8位，包含字母和数字）
            example: "password123"
          role:
            type: string
            enum: ["viewer", "trader", "admin"]
            default: "viewer"
            description: 用户角色
  responses:
    201:
      description: 注册成功
      schema:
        type: object
        properties:
          message:
            type: string
            example: "注册成功"
          data:
            type: object
            properties:
              user:
                $ref: '#/definitions/User'
          code:
            type: integer
            example: 201
    400:
      description: 请求参数错误
      schema:
        $ref: '#/definitions/ErrorResponse'
    409:
      description: 用户已存在
      schema:
        $ref: '#/definitions/ErrorResponse'
    429:
      description: 请求过于频繁
      schema:
        $ref: '#/definitions/ErrorResponse'
    500:
      description: 服务器内部错误
      schema:
        $ref: '#/definitions/ErrorResponse'